services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: philately
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-philately-local}
      POSTGRES_DB: philately
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U philately"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://philately:${POSTGRES_PASSWORD:-philately-local}@db:5432/philately
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      UPLOAD_FOLDER: /app/instance/uploads
    volumes:
      - uploads:/app/instance/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
