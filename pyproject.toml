[project]
name = "philately-dashboard"
version = "2.0.0"
description = "Marketplace and community platform for stamp collectors and postal circles, with listing verification."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.0",
    "flask-login>=0.6.3",
    "flask-wtf>=1.2",
    "email-validator>=2.1",
    "pillow>=10.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
    "gunicorn>=22.0",
    "authlib>=1.3",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "flask-limiter>=3.5",
    "boto3>=1.34",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
