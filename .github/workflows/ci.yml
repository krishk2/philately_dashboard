name: CI

on:
  push:
    branches: [main, revamp]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: philately
          POSTGRES_PASSWORD: philately
          POSTGRES_DB: philately
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U philately"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.13"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Unit and integration tests
        run: uv run pytest --cov=app --cov-report=term-missing
      - name: Migrations apply cleanly to Postgres
        env:
          FLASK_APP: wsgi.py
          FLASK_ENV_NAME: production
          SECRET_KEY: ci-only
          DATABASE_URL: postgresql+psycopg://philately:philately@localhost:5432/philately
        run: |
          uv run flask db upgrade
          uv run flask seed

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t philately-dashboard .
