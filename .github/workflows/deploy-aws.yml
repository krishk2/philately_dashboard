# Build, push to ECR, migrate, and roll the ECS services. Manual trigger only.
#
# Repository variables to set first (Settings > Secrets and variables > Actions > Variables):
#   AWS_REGION, AWS_ROLE_ARN (an IAM role trusted for GitHub OIDC), ECR_REPOSITORY,
#   ECS_CLUSTER, ECS_WEB_SERVICE, ECS_WORKER_SERVICE, ECS_SUBNETS (comma-separated),
#   ECS_SECURITY_GROUPS (comma-separated)
# See deploy/aws/README.md for the one-time AWS setup.
name: Deploy to AWS

on:
  workflow_dispatch:

permissions:
  id-token: write   # GitHub OIDC -> AWS, so no long-lived AWS keys are stored here
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Run database migrations (one-off task)
        run: |
          TASK_DEF=$(aws ecs describe-services --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_WEB_SERVICE }}" --query 'services[0].taskDefinition' --output text)
          TASK_ARN=$(aws ecs run-task --cluster "${{ vars.ECS_CLUSTER }}" --launch-type FARGATE \
            --task-definition "$TASK_DEF" \
            --overrides '{"containerOverrides":[{"name":"app","command":["migrate"]}]}' \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.ECS_SUBNETS }}],securityGroups=[${{ vars.ECS_SECURITY_GROUPS }}],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$TASK_ARN"
          CODE=$(aws ecs describe-tasks --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          test "$CODE" = "0"

      - name: Roll services onto the new image
        run: |
          for SERVICE in "${{ vars.ECS_WEB_SERVICE }}" "${{ vars.ECS_WORKER_SERVICE }}"; do
            aws ecs update-service --cluster "${{ vars.ECS_CLUSTER }}" --service "$SERVICE" --force-new-deployment > /dev/null
          done
          aws ecs wait services-stable --cluster "${{ vars.ECS_CLUSTER }}" --services "${{ vars.ECS_WEB_SERVICE }}"
