{% extends "base.html" %}
{% from "_ui.html" import circle_nav, csrf with context %}
{% block title %}Settings{% endblock %}
{% block content %}
<div class="account">
    {{ circle_nav('settings') }}
    <div class="stack">
        <div class="page-head" style="margin-bottom:0"><div><h1>Settings</h1><p>Postal circle account.</p></div></div>
        <form class="card form" method="POST" action="{{ url_for('circle.update_profile') }}">
            {{ csrf() }}
            <h2>Profile settings</h2>
            <div class="form-grid">
                <div><label for="username">Username</label><input type="text" id="username" value="{{ current_user.username }}" disabled></div>
                <div><label for="postalCircle">Postal circle</label><input type="text" id="postalCircle" value="{{ current_user.postal_circle }}" disabled></div>
            </div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ current_user.email }}" required>
            <div class="actions"><button type="submit" class="btn">Save changes</button></div>
        </form>
        <form class="card form" method="POST" action="{{ url_for('circle.update_password') }}">
            {{ csrf() }}
            <h2>Password settings</h2>
            <label for="currentPassword">Current password</label>
            <input type="password" id="currentPassword" name="currentPassword" required autocomplete="current-password">
            <div class="form-grid">
                <div><label for="newPassword">New password</label><input type="password" id="newPassword" name="newPassword" minlength="8" required autocomplete="new-password"></div>
                <div><label for="confirmPassword">Confirm new password</label><input type="password" id="confirmPassword" name="confirmPassword" minlength="8" required autocomplete="new-password"></div>
            </div>
            <div class="actions"><button type="submit" class="btn">Update password</button></div>
        </form>
    </div>
</div>
{% endblock %}
