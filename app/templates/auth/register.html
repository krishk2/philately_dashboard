{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Sign up{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Create an account</h1>
  <form method="post">
    {{ csrf() }}
    <fieldset class="roles">
      <legend>Account type</legend>
      <label class="check"><input type="radio" name="role" value="collector" required {% if form.get('role', 'collector') == 'collector' %}checked{% endif %}> Collector: buy, sell and pre-book stamps</label>
      <label class="check"><input type="radio" name="role" value="circle" {% if form.get('role') == 'circle' %}checked{% endif %}> Postal circle: publish official issues and events</label>
    </fieldset>
    <label>Postal circle (circle accounts only)
      <select name="postal_circle">
        <option value="">Choose…</option>
        {% for c in circles %}<option {% if form.get('postal_circle') == c %}selected{% endif %}>{{ c }}</option>{% endfor %}
      </select>
    </label>
    <label>Username <input name="username" value="{{ form.get('username', '') }}" required autocomplete="username"></label>
    <label>Email <input type="email" name="email" value="{{ form.get('email', '') }}" required autocomplete="email"></label>
    <label>Password (8+ characters) <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <button class="btn">Sign up</button>
  </form>
</section>
{% endblock %}
