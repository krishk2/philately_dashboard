{% from "_member_sidebar.html" import member_sidebar with context %}
{% from "_flash.html" import plain, csrf %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Philatelist</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles_for_settings.css') }}">
</head>
<body>
    <div class="container">
        {{ member_sidebar('settings') }}

        <div class="main-content">
            <header class="dashboard-header">
                <h2>Settings</h2>
            </header>

            {{ plain() }}

            <section class="settings-section">
                <h3>Profile Settings</h3>
                <form id="profileForm" method="POST" action="{{ url_for('member.update_email') }}">
                    {{ csrf() }}
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" value="{{ current_user.username }}" disabled>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" value="{{ current_user.email }}" required>

                    <button type="submit" class="save-button">Save Changes</button>
                </form>

                <h3>Password Settings</h3>
                <form id="passwordForm" method="POST" action="{{ url_for('member.update_password') }}">
                    {{ csrf() }}
                    <label for="currentPassword">Current Password</label>
                    <input type="password" id="currentPassword" name="currentPassword" required autocomplete="current-password">

                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" minlength="8" required autocomplete="new-password">

                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" minlength="8" required autocomplete="new-password">

                    <button type="submit" class="save-button">Update Password</button>
                </form>
            </section>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script_for_settings.js') }}"></script>
</body>
</html>
