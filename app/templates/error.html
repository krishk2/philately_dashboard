{% extends "base.html" %}
{% block title %}{{ error.code }} {{ error.name }}{% endblock %}
{% block container_class %}narrow{% endblock %}
{% block content %}
<div class="card" style="text-align:center;padding:40px 24px">
    <div style="font:700 3.5rem/1 var(--serif);color:var(--teal)">{{ error.code }}</div>
    <h1 style="margin-top:10px">{{ error.name }}</h1>
    <p class="muted">{{ error.description }}</p>
    <div class="row" style="justify-content:center;margin-top:16px">
        <a class="btn" href="{{ url_for('main.home') }}">Back to home</a>
        <a class="btn ghost" href="{{ url_for('main.buyer_home') }}">Browse stamps</a>
    </div>
</div>
{% endblock %}
