{% from "_flash.html" import plain, csrf %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Stamps</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles_for_stamps.css') }}">
    <style>
        /* Date inputs weren't in the original stylesheet; match the text inputs. */
        input[type="date"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo-section">
                <img src="{{ url_for('static', filename='India-Post_Preview.png') }}" alt="India Post Logo" class="logo">
                <h1>Postal Circle Dashboard</h1>
            </div>
            <ul class="nav-links">
                <li><a href="{{ url_for('circle.dashboard') }}">Dashboard</a></li>
                <li><a href="{{ url_for('circle.manage_stamps') }}" class="active">Manage Stamps</a></li>
                <li><a href="{{ url_for('circle.events') }}">Events</a></li>
                <li><a href="{{ url_for('circle.settings') }}">Settings</a></li>
                <li><a href="{{ url_for('community.forums', category='help') }}">Help & Support</a></li>
            </ul>
            <form action="{{ url_for('auth.logout') }}" method="post">
                {{ csrf() }}
                <button type="submit" class="logout-button">Logout</button>
            </form>
        </aside>

        <div class="main-content">
            <header class="dashboard-header">
                <h2>Manage Stamps</h2>
            </header>

            {{ plain() }}

            <section class="manage-stamps-section">
                <h3>Add New Stamp</h3>
                <form id="addStampForm" method="post" enctype="multipart/form-data" action="{{ url_for('circle.add_stamp') }}">
                    {{ csrf() }}
                    <label for="stampName">Stamp Name</label>
                    <input type="text" id="stampName" name="stampName" placeholder="Enter stamp name" maxlength="150" required>

                    <label for="stampDate">Date of Issue</label>
                    <input type="date" id="stampDate" name="stampDate" required>

                    <label for="stampPrice">Price</label>
                    <input type="number" step="0.01" min="0.01" id="stampPrice" name="stampPrice" placeholder="Enter stamp price" required>

                    <label for="stampStock">Copies Available for Pre-Booking</label>
                    <input type="number" min="0" id="stampStock" name="stampStock" placeholder="Enter quantity (you can change it later)">

                    <label for="stampDescription">Description</label>
                    <textarea id="stampDescription" name="stampDescription" rows="3" placeholder="Enter a short description"></textarea>

                    <label for="stampImage">Upload Image</label>
                    <input type="file" id="stampImage" name="stampImage" accept="image/png,image/jpeg,image/webp" required>

                    <button type="submit" class="submit-button">Add Stamp</button>
                </form>

                <h3>Update or Delete Existing Stamps</h3>
                <form id="updateStampForm" method="post" action="{{ url_for('circle.update_stamp') }}">
                    {{ csrf() }}
                    <label for="existingStamps">Select Stamp</label>
                    <select id="existingStamps" name="existingStamps" required>
                        {% for issue in issues %}
                        <option value="{{ issue.id }}" data-name="{{ issue.title }}" data-date="{{ issue.issue_date.isoformat() }}" data-price="{{ issue.denomination }}">{{ issue.title }} ({{ issue.issue_date.strftime('%d %b %Y') }}, ₹{{ issue.denomination }}) · {{ booked.get(issue.id, 0) }} pre-booked, {{ issue.prebook_available }} left</option>
                        {% else %}
                        <option value="" disabled selected>No stamps yet</option>
                        {% endfor %}
                    </select>

                    <label for="updateStampName">Stamp Name</label>
                    <input type="text" id="updateStampName" name="updateStampName" placeholder="Enter new name">

                    <label for="updateStampDate">Date of Issue</label>
                    <input type="date" id="updateStampDate" name="updateStampDate">

                    <label for="updateStampPrice">Price</label>
                    <input type="number" step="0.01" min="0.01" id="updateStampPrice" name="updateStampPrice" placeholder="Enter new price">

                    <button type="submit" class="submit-button">Update Stamp</button>
                    <button type="submit" form="deleteStampForm" id="deleteStampButton" class="submit-button" style="background-color: #dc3545;">Delete Stamp</button>
                </form>
                <form id="deleteStampForm" method="post" action="{{ url_for('circle.delete_stamp') }}">
                    {{ csrf() }}
                    <input type="hidden" id="deleteStampId" name="deleteStampId" value="">
                </form>
            </section>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script_for_stamps.js') }}"></script>
</body>
</html>
