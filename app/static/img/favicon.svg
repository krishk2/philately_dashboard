<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="National Philatelic Community">
  <defs>
    <mask id="perf">
      <rect width="64" height="64" fill="#fff"/>
      <!-- perforation holes along all four edges -->
      <g fill="#000">
        <circle cx="4" cy="0" r="3"/><circle cx="14" cy="0" r="3"/><circle cx="24" cy="0" r="3"/><circle cx="34" cy="0" r="3"/><circle cx="44" cy="0" r="3"/><circle cx="54" cy="0" r="3"/><circle cx="64" cy="0" r="3"/>
        <circle cx="4" cy="64" r="3"/><circle cx="14" cy="64" r="3"/><circle cx="24" cy="64" r="3"/><circle cx="34" cy="64" r="3"/><circle cx="44" cy="64" r="3"/><circle cx="54" cy="64" r="3"/><circle cx="64" cy="64" r="3"/>
        <circle cx="0" cy="4" r="3"/><circle cx="0" cy="14" r="3"/><circle cx="0" cy="24" r="3"/><circle cx="0" cy="34" r="3"/><circle cx="0" cy="44" r="3"/><circle cx="0" cy="54" r="3"/>
        <circle cx="64" cy="4" r="3"/><circle cx="64" cy="14" r="3"/><circle cx="64" cy="24" r="3"/><circle cx="64" cy="34" r="3"/><circle cx="64" cy="44" r="3"/><circle cx="64" cy="54" r="3"/>
      </g>
    </mask>
  </defs>
  <rect width="64" height="64" rx="2" fill="#ffffff" mask="url(#perf)"/>
  <rect x="7" y="7" width="50" height="50" rx="3" fill="#0b3558"/>
  <rect x="7" y="40" width="50" height="17" rx="0" fill="#0fb39a"/>
  <!-- envelope -->
  <rect x="17" y="17" width="30" height="21" rx="2.5" fill="#ffffff"/>
  <path d="M17.8 18.5 32 29.5l14.2-11" fill="none" stroke="#0b3558" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- denomination dots -->
  <circle cx="22" cy="48.5" r="2.2" fill="#ffffff"/>
  <circle cx="29" cy="48.5" r="2.2" fill="#ffffff" opacity=".7"/>
</svg>
